version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
      ionic-capacitor:
        patterns:
          - "@ionic/*"
          - "@capacitor/*"
      development-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
