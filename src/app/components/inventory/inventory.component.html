<div class="inventory">
  <div class="inventory-intro">
    <p class="inventory-eyebrow">Across every loop</p>
    <h2>Things you carry</h2>
    <p>Objects fade. Some memories refuse to.</p>
  </div>

  <ng-container *ngIf="has_no_inventory(false)">
    <div class="inventory-empty">
      <ion-icon name="cube-outline"></ion-icon>
      <strong>Your pockets are empty.</strong>
      <span>Explore the story to find something worth keeping.</span>
    </div>
  </ng-container>

  <div class="inventory-item-container">
    <ng-container *ngFor="let item of stream.inventory; let i = index">
      <ng-container
        *ngIf="!item.hidden && item.quantity > 0 && !item.is_status"
      >
        <article class="inventory-item" id="inventory-item-{{ i }}">
          <div class="inventory-item-background">
            <img [src]="item.avatar" [alt]="item.name" />
          </div>

          <div class="inventory-item-title">
            {{ item.name }}
          </div>

          <ng-container *ngIf="item.quantity > 1 || item.always_show_chip">
            <div class="inventory-item-quantity">
              {{ item.quantity }}
            </div>
          </ng-container>
        </article>
      </ng-container>
    </ng-container>
  </div>

  <div class="inventory-title">Memories & milestones</div>

  <ng-container *ngIf="has_no_inventory(true)">
    <div class="inventory-empty is-compact">
      <strong>No echoes yet.</strong>
      <span>The day has only just begun.</span>
    </div>
  </ng-container>

  <div class="inventory-item-container is-status-container">
    <ng-container *ngFor="let item of stream.inventory; let i = index">
      <ng-container *ngIf="!item.hidden && item.quantity > 0 && item.is_status">
        <article class="inventory-item" id="inventory-item-{{ i }}">
          <div class="inventory-item-background">
            <img [src]="item.avatar" [alt]="item.name" />
          </div>

          <div class="inventory-item-title">
            {{ item.name }}
          </div>

          <ng-container *ngIf="item.quantity > 1 || item.always_show_chip">
            <div class="inventory-item-quantity">
              {{ item.quantity }}
            </div>
          </ng-container>
        </article>
      </ng-container>
    </ng-container>
  </div>
</div>
