<div class="characters">
  <div class="characters-intro">
    <p class="characters-eyebrow">Those caught in the day</p>
    <h2>Your Company</h2>
    <p>Every encounter leaves an impression, even when morning returns.</p>
  </div>

  <ng-container *ngIf="has_no_characters()">
    <div class="characters-empty">
      <ion-icon name="people-outline"></ion-icon>
      <strong>No familiar faces yet.</strong>
      <span>Return to the story and see who answers.</span>
    </div>
  </ng-container>

  <div class="characters-item-container">
    <ng-container *ngFor="let item of stream.characters | keyvalue">
      <ng-container *ngIf="!item.value.hidden">
        <a
          class="characters-item"
          id="characters-item-{{ item.value.identifier }}"
          [routerLink]="['/character-detail', item.value.identifier]"
          [attr.aria-label]="'View details for ' + item.value.name"
        >
          <div class="characters-item-background">
            <img [src]="item.value.avatar" [alt]="item.value.name" />
          </div>

          <div class="characters-item-title">
            {{ item.value.name }}
          </div>
        </a>
      </ng-container>
    </ng-container>
  </div>
</div>
