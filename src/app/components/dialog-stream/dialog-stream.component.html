<div class="dialog-stream">
  <div
    class="dialog-stream-scroller"
    id="dialog-stream-scroller"
    role="log"
    aria-live="polite"
    aria-relevant="additions"
  >
    <div
      *ngIf="!dialog_stream_service.initialized"
      class="dialog-stream-loading"
      role="status"
    >
      <span class="dialog-stream-loading-mark" aria-hidden="true">∞</span>
      <span>Remembering where you left off…</span>
    </div>

    <ng-container *ngIf="dialog_stream_service.initialized">
      <ng-container
        *ngFor="
          let item of dialog_stream_service.dialog_stream.feed;
          let i = index
        "
      >
        <div
          class="dialog-stream-item"
          id="dialog-stream-item-{{ i }}"
          [ngClass]="{
            'is-player': item.speaker && item.speaker.identifier === 'player',
            'is-media':
              item.command === 'SHOW_IMAGE' || item.command === 'SET_SPEAKER',
            'is-full': item.command === 'EMOTE',
            'is-empty':
              item.command === 'DELAY' ||
              item.command === 'ADD_ITEM' ||
              item.command === 'CLEAR_INVENTORY',
          }"
        >
          <div class="dialog-stream-item-diagnostics">
            RAW: {{ item.raw }}
            <br />
            CMD: {{ item.command }}
            <br />
            ARG: {{ item.argument }}
            <br />
            SPEAKER: {{ item.speaker ? item.speaker.identifier : null }}
          </div>
          <div class="dialog-stream-item-inner">
            <ng-container *ngIf="item.command === 'SHOW_TEXT'">
              <div class="dialog-stream-item-text">
                <div class="dialog-stream-item-text-content">
                  <span class="sr-only">
                    {{ item.speaker?.name || "Narrator" }}:
                  </span>
                  {{ item.argument }}
                </div>
              </div>
            </ng-container>

            <ng-container *ngIf="item.command === 'SHOW_IMAGE'">
              <div class="dialog-stream-item-image">
                <img src="{{ item.argument }}" alt="A new scene in the story" />
              </div>
            </ng-container>

            <ng-container *ngIf="item.command === 'FLASH_IMAGE'">
              <div class="dialog-stream-item-image is-small">
                <img
                  src="{{ item.argument }}"
                  alt="{{ item.speaker?.name || 'Character' }} reacts"
                />
              </div>
            </ng-container>

            <ng-container *ngIf="item.command === 'EMOTE'">
              <div class="dialog-stream-item-emote">
                {{ item.argument }}
              </div>
            </ng-container>

            <ng-container *ngIf="item.command === 'SET_SPEAKER'">
              <div class="dialog-stream-item-speaker">
                <div class="dialog-stream-item-speaker-avatar">
                  <img
                    src="{{ item.speaker.avatar }}"
                    alt="{{ item.speaker.name }}"
                  />
                </div>

                <div class="dialog-stream-item-speaker-title-container">
                  <div class="dialog-stream-item-speaker-title">
                    {{ item.speaker.name }}
                  </div>
                </div>
              </div>
            </ng-container>
          </div>
        </div>
      </ng-container>

      <div
        class="dialog-stream-option-container"
        id="dialog-stream-option-container"
        *ngIf="dialog_stream_service.dialog_stream.options.length"
      >
        <p class="dialog-stream-option-prompt">What do you do?</p>
        <ng-container
          *ngFor="let option of dialog_stream_service.dialog_stream.options"
        >
          <button
            type="button"
            class="dialog-stream-option"
            (click)="dialog_stream_service.select_option(option)"
          >
            <div class="dialog-stream-option-title">
              {{ option.title }}
            </div>

            <div class="dialog-stream-option-icon">
              <ion-icon name="arrow-forward-outline"></ion-icon>
            </div>
          </button>
        </ng-container>
      </div>
    </ng-container>
  </div>
</div>
