<ion-header class="game-header">
  <ion-toolbar>
    <ion-title>
      <span class="game-header-kicker">The repeating day</span>
      <span class="game-header-title">Today Nonstop</span>
    </ion-title>
    <ion-buttons slot="end">
      <ion-button aria-label="Change story pacing" (click)="cycle_speed()">
        <ion-icon slot="icon-only" [name]="speed_icon"></ion-icon>
      </ion-button>
      <ion-menu-button menu="game-menu" aria-label="Open game menu">
        <ion-icon name="menu-outline"></ion-icon>
      </ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
  <div class="game-status" aria-label="Current game progress">
    <span>
      <ion-icon name="repeat-outline"></ion-icon>
      Loop {{ lives_lived }}
    </span>
    <span>{{ speed_label }}</span>
  </div>
</ion-header>

<ion-content>
  <app-dialog-stream></app-dialog-stream>
</ion-content>
